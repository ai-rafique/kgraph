[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kgraph"
version = "0.1.0"
description = "Turn a folder of code, docs and papers into a queryable knowledge graph so LLMs read less and spend fewer tokens."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4"]
all = ["pypdf>=4", "networkx>=3"]

[project.scripts]
kgraph = "kgraph.cli:main"

[tool.setuptools.packages.find]
include = ["kgraph*"]

[tool.setuptools.package-data]
kgraph = ["templates/*"]
